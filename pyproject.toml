[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge"
version = "0.1.0"
description = "TaskForge: self-checking factory for Harbor coding-task packages (Innodata Hackathon, Track 1)"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "jinja2>=3.1",
  "httpx>=0.27",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-json-report"]
dashboard = ["streamlit>=1.35"]

[project.scripts]
taskforge = "taskforge.cli:app"

[tool.setuptools.packages.find]
include = ["taskforge*"]

[tool.setuptools.package-data]
taskforge = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
