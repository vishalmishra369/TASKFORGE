name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q          # no network, no API keys, no Docker needed
      - name: Secret scan (fail if a key-looking string is committed)
        run: |
          ! git grep -nE "AIza[0-9A-Za-z_-]{30,}|sk-ant-[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z]{30,}" -- . ':!.github'
  harbor-schema:
    # proves generated packages load in the real Harbor 0.25 task model (no Docker needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,dashboard]" "harbor==0.25.*"
      - run: pytest -q tests/test_harbor_schema_dashboard.py
